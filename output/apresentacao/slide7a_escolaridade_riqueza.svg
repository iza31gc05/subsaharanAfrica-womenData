  </g>
  <g id="text_37">
   <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #605951" x="51.84" y="81" transform="rotate(-0 51.84 81)">Comparação entre perfis de mulheres de 25–39 anos, com a mesma composição etária em cada país</text>
  </g>
  <g id="text_38">
   <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #605951" transform="translate(51.84 591.551324)">Menor riqueza = quintis 1–2; maior riqueza = quintis 4–5, relativos a cada país. Uso atual de qualquer método.</text>
   <text style="font-size: 11.5px; font-family: 'DejaVu Sans'; fill: #605951" transform="translate(51.84 609.12)">Somente países com ≥30 respostas por perfil em cada faixa: 25–29, 30–34 e 35–39 anos. Associações descritivas, sem inferência causal.</text>
  </g>
